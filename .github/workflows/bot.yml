name: trend-bot

on:
  schedule:
    - cron: "15 22 * * 1-5"    # 22:15 UTC Mon-Fri, after the US close in both EST and EDT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trend-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12        # 20 price fetches; fail fast if Yahoo hangs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run the daily tick (both arms)
        run: python trend_paper.py --once
      - name: Save state back to the repo
        run: |
          git config user.name  "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
